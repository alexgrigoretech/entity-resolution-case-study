[project]
name = "entity-resolver"
version = "0.1.0"
description = "Match, dedupe and enrich inbound organization and people records against an existing database."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "numpy",
    "rapidfuzz",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data"]
